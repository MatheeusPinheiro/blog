{% extends 'autenticacao/base.html' %}

{% block title %} Login com redes sociais {% endblock %}


{% block content %}

<div class="container d-flex justify-content-center mt-5">

    <div class="card">
        <div class="card-header">
            
            <div class="h3 text-center">Login com Redes Sociais</div>

        </div>
        <div class="card-body">
            <div class="d-flex justify-content-center flex-column align-items-center m-2">

       

            <div class="h4">Você está prestes a se conectar ao blog com sua conta {{provider.name.title}}</div>
                <form method="post">
                    {% csrf_token %}
                    <button class="btn btn-primary btn-larger" type="submit">
                        Continuar
                    </button>
                </form>
            </div>

        </div>
    </div>


 
  

</div>

{% endblock %}
